<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Admin</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      flex-direction: column;
      padding: 20px;
    }

    .card {
      background-color: #1e293b;
      padding: 40px 30px;
      border-radius: 16px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      text-align: center;
    }

    .logo-container {
      margin-bottom: 20px;
      display: flex;
      justify-content: center;
    }

    .logo-img {
      max-width: 100%;
      height: auto;
      max-height: 100px;
    }

    .subtitle {
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 30px;
    }

    .form-group {
      text-align: left;
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      color: #cbd5e1;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .form-group input {
      width: 100%;
      padding: 12px 16px;
      background-color: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #ffffff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-group input:focus {
      border-color: #38bdf8;
    }

    .btn-submit {
      width: 100%;
      padding: 12px;
      background-color: #0284c7;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      transition: background-color 0.2s;
    }

    .btn-submit:hover {
      background-color: #0369a1;
    }

    .footer {
      margin-top: 30px;
      color: #64748b;
      font-size: 12px;
      text-align: center;
    }

    .footer a {
      color: #38bdf8;
      text-decoration: none;
    }

    .footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <div class="card">
    <div class="logo-container">
      <img src="logo-login.png" alt="Logo Plaza Minuman" class="logo-img">
    </div>

    <p class="subtitle">Sistem Manajemen Finansial Terintegrasi</p>

    <form>
      <div class="form-group">
        <label for="username">Username Admin</label>
        <input type="text" id="username" placeholder="Masukkan username">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Masukkan password">
      </div>

      <button type="submit" class="btn-submit">Masuk</button>
    </form>
  </div>

  <div class="footer">
    <p>&copy; 2026 Plaza Minuman. All rights reserved.</p>
    <p>Butuh bantuan? <a href="#">Hubungi Tim IT</a></p>
  </div>

</body>

</html>
