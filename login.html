<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Admin - Plaza Minuman</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      flex-direction: column;
      padding: 20px;
    }

    .card {
      background-color: #1e293b;
      padding: 40px 30px;
      border-radius: 16px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      text-align: center;
    }

    .logo-container {
      margin-bottom: 20px;
      display: flex;
      justify-content: center;
    }

    .logo-img {
      max-width: 100%;
      height: auto;
      max-height: 100px;
    }

    .subtitle {
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 30px;
    }

    .alert-error {
      background-color: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.2);
      color: #fca5a5;
      padding: 10px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 20px;
      display: none;
      text-align: left;
    }

    .form-group {
      text-align: left;
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      color: #cbd5e1;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .form-group input {
      width: 100%;
      padding: 12px 16px;
      background-color: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #ffffff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-group input:focus {
      border-color: #38bdf8;
    }

    .btn-submit {
      width: 100%;
      padding: 12px;
      background-color: #0284c7;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      transition: background-color 0.2s;
    }

    .btn-submit:hover {
      background-color: #0369a1;
    }

    .btn-submit:disabled {
      background-color: #334155;
      cursor: not-allowed;
    }

    .footer {
      margin-top: 30px;
      color: #64748b;
      font-size: 12px;
      text-align: center;
    }

    .footer a {
      color: #38bdf8;
      text-decoration: none;
    }

    .footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <div class="card">
    <div class="logo-container">
      <img src="logo-login.png" alt="Logo Plaza Minuman" class="logo-img">
    </div>

    <p class="subtitle">Sistem Manajemen Finansial Terintegrasi</p>

    <div id="alert-error" class="alert-error"></div>

    <form id="form-login">
      <div class="form-group">
        <label for="username">Username Admin</label>
        <input type="text" id="username" placeholder="Masukkan username" required autocomplete="username">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Masukkan password" required autocomplete="current-password">
      </div>

      <button type="submit" id="btn-login" class="btn-submit">Masuk</button>
    </form>
  </div>

  <div class="footer">
    <p>&copy; 2026 Plaza Minuman. All rights reserved.</p>
    <p>Butuh bantuan? <a href="#">Hubungi Tim IT</a></p>
  </div>

  <script>
    const SUPABASE_URL = "https://vccwscybnhpatjioixfx.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_blMwzDZ5pM1TciQzhsg8UQ_cCB_ixOQ";
    const clientSupabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const formLogin = document.getElementById('form-login');
    const alertError = document.getElementById('alert-error');
    const btnLogin = document.getElementById('btn-login');

    formLogin.addEventListener('submit', async function (e) {
      e.preventDefault();
      alertError.style.display = 'none';
      alertError.innerText = '';

      const usernameInput = document.getElementById('username').value.trim();
      const passwordInput = document.getElementById('password').value.trim();

      btnLogin.disabled = true;
      btnLogin.innerText = 'Memeriksa...';

      try {
        const { data, error } = await clientSupabase
          .from('admin_list')
          .select('*')
          .eq('username', usernameInput)
          .eq('password', passwordInput)
          .single();

        if (error || !data) {
          alertError.innerText = 'Username atau password salah!';
          alertError.style.display = 'block';
          btnLogin.disabled = false;
          btnLogin.innerText = 'Masuk';
          return;
        }

        localStorage.setItem('current_admin', data.username);
        localStorage.setItem('admin_role', data.role);
        localStorage.setItem('admin_name', data.nama_lengkap || data.username);

        if (data.role === 'master' || data.role === 'owner') {
          window.location.href = 'index.html';
        } else if (data.role === 'admin_cabang') {
          window.location.href = 'cabang.html';
        } else if (data.role === 'admin_finansial') {
          window.location.href = 'finansial.html';
        } else {
          alertError.innerText = 'Role akun tidak dikenali. Hubungi Tim IT!';
          alertError.style.display = 'block';
          btnLogin.disabled = false;
          btnLogin.innerText = 'Masuk';
        }

      } catch (err) {
        console.error(err);
        alertError.innerText = 'Terjadi kesalahan koneksi ke server!';
        alertError.style.display = 'block';
        btnLogin.disabled = false;
        btnLogin.innerText = 'Masuk';
      }
    });
  </script>

</body>

</html>
